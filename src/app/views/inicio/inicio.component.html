<!-- 1. CABECERA INSTITUCIONAL ESTÁNDAR (SISTEMA CERRADO) -->
<oefa-page-layout title="Plataforma de Inteligencia de Negocios"
  subtitle="Información integrada para una gestión ambiental eficiente, transparente y basada en evidencia."
  [fit]="false">
  <div actions class="oefa-flex-row oefa-gap-sm">
    <oefa-button variant="primary" size="md" icon="search" routerLink="/catalogo">
      Explorar Tableros
    </oefa-button>
  </div>


  <!-- 2. PROCESOS INSTITUCIONALES (Rejilla global .oefa-grid-3) -->
  <div class="oefa-stack-lg">
    <section aria-label="Categorías de procesos institucionales">
      <div class="oefa-grid-3">
        <oefa-process-card title="Procesos&#10;Estratégicos"
          description="Tableros e indicadores de la gestión estratégica institucional." variant="estrategico"
          theme="light" bgImage="/images/card_fondo_01.webp" actionText="Explorar"
          (cardClick)="onExploreProcess('Estratégico')" />

        <oefa-process-card title="Procesos&#10;Misionales"
          description="Supervisión, fiscalización y evaluación ambiental a nivel nacional." variant="misional"
          theme="light" bgImage="/images/card_fondo_01.webp" actionText="Explorar"
          (cardClick)="onExploreProcess('Misional')" />

        <oefa-process-card title="Procesos&#10;de Apoyo"
          description="Soporte administrativo, recursos, sistemas y gestión interna." variant="apoyo" theme="light"
          bgImage="/images/card_fondo_01.webp" actionText="Explorar" (cardClick)="onExploreProcess('Apoyo')" />
      </div>
    </section>

    <!-- 3. SECCIÓN DIVIDIDA: CIFRAS Y DESTACADOS EN LA MISMA FILA (.oefa-grid-2) -->
    <section aria-label="OEFA en cifras y tableros destacados">
      <div class="oefa-grid-2">


        <!-- Columna 1: Tableros destacados -->
        <oefa-card title="Tableros destacados">
          <div card-actions>
            <a routerLink="/catalogo" class="oefa-card-link">Ver catálogo completo →</a>
          </div>

          <div class="destacados-cards-grid">
            @for (item of destacados; track item.title) {
            <a [routerLink]="item.url" class="mini-destacado-card">
              <div class="mini-card-header">
                <span class="mini-card-category">{{ item.category }}</span>
                <span class="mini-card-date">{{ item.date }}</span>
              </div>

              <h4 class="mini-card-title">{{ item.title }}</h4>

              <div class="mini-card-footer">
                <span class="mini-card-action">Ver tablero</span>
                <oefa-icon name="arrow-right" [size]="16" class="mini-card-arrow" />
              </div>
            </a>
            }
          </div>
        </oefa-card>

        <!-- Columna 2: OEFA en Cifras y Card Imagen en vertical -->
        <div class="cifras-column">
          <oefa-card title="OEFA en cifras">
            <div class="oefa-grid-2 oefa-gap-md">
              @for (cifra of cifras; track cifra.label) {
              <oefa-stat [number]="cifra.number" [label]="cifra.label" [icon]="cifra.icon" size="md" />
              }
            </div>
          </oefa-card>
          <oefa-card class="banner-card">
            <div class="banner-content">
              <span class="banner-tag">COMUNICADO</span>
              <h4 class="banner-title">Compromiso con la fiscalización ambiental</h4>
            </div>
          </oefa-card>
        </div>
      </div>
    </section>
  </div>
</oefa-page-layout>
